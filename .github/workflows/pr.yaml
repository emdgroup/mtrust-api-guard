name: "PR to Main"
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

jobs:
  validate_pr:
    permissions:
      pull-requests: write
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # Version the package
  version:
    uses: ./.github/workflows/pr_workflow.yaml
    with:
      use_local_version: true
      pre_release: ${{ github.ref_name == 'dev' }}

  # Validate the Dart code
  validate_dart:
    runs-on: ubuntu-latest
    # dorny/test-reporter publishes the results as a check run of its own.
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate Dart code
        uses: ./.github/actions/validate-dart
