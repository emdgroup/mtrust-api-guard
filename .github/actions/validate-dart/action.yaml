name: "Validate Dart Code"
description: "Validates Dart code by running tests, linter, and build runner"
runs:
  using: "composite"
  steps:
    - name: Install Flutter
      uses: subosito/flutter-action@v2
    - name: Install dependencies
      shell: bash
      run: flutter pub get
    - name: Run build runner
      shell: bash
      run: flutter pub run build_runner build --delete-conflicting-outputs

    - name: Run linter
      shell: bash
      run: flutter analyze
    - name: Run tests
      shell: bash
      run: |
        dart run tool/cleanup_legacy_scaffolds.dart
        flutter test test/commands test/comparators test/dead_code test/version --coverage
    - name: Report test results
      # Without this the step is skipped exactly when the tests fail, which is
      # when the report is worth having.
      if: always()
      uses: dorny/test-reporter@v2
      with:
        name: Flutter Tests
        path: reports/test-results.json
        reporter: flutter-json
        # An earlier step failing means there is no report to publish, which is
        # not itself a failure worth reporting.
        fail-on-empty: false
